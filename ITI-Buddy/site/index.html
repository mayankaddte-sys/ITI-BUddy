<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITI Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--surface:#fff;--ink:#1d2433;--muted:#667085;--line:#e4ded0;--brand:#0f766e;--brand2:#4f46e5;--brand-ink:#fff;--bot:#fff;--warn:#fff6dc;--warn-ink:#6a4b00;--shadow:0 6px 18px rgba(20,30,60,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--surface:#171e2e;--ink:#eef1f7;--muted:#9aa6bd;--line:#2a3550;--brand:#2dd4bf;--brand2:#818cf8;--brand-ink:#06231f;--bot:#1b2437;--warn:#3a3010;--warn-ink:#f2d98a;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--surface:#171e2e;--ink:#eef1f7;--muted:#9aa6bd;--line:#2a3550;--brand:#2dd4bf;--brand2:#818cf8;--brand-ink:#06231f;--bot:#1b2437;--warn:#3a3010;--warn-ink:#f2d98a;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif}
.app{max-width:780px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;color:#fff;background:radial-gradient(circle at 90% -20%,rgba(255,255,255,.28),transparent 45%),linear-gradient(120deg,#0f766e,#4f46e5)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.2);font-size:1.25rem;flex:none}
h1{margin:0;font-size:1.12rem;font-weight:700;letter-spacing:.01em}
header p{margin:0;font-size:.74rem;opacity:.92;line-height:1.3}
#lang{flex:none;border:1.5px solid rgba(255,255,255,.7);color:#fff;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer;transition:background .15s}
#lang:hover{background:rgba(255,255,255,.3)}
.crumb{padding:4px 14px;font-size:.76rem;font-weight:600;color:var(--brand);background:var(--surface);border-bottom:1px solid var(--line)}
[hidden]{display:none!important}
.note{margin:8px 14px 0;padding:6px 10px;border-radius:10px;background:var(--warn);color:var(--warn-ink);font-size:.8rem}
#log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:92%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;animation:msgIn .28s ease both;box-shadow:var(--shadow)}
.u{align-self:flex-end;background:linear-gradient(120deg,var(--brand),var(--brand2));color:var(--brand-ink);border-bottom-right-radius:4px;max-width:80%}
.b{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-left:4px solid var(--brand);border-bottom-left-radius:4px}
.b:has(.tiles){max-width:100%;width:100%}
.src{display:block;margin-top:6px;font-size:.76rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{border:1.5px solid var(--brand);color:var(--brand);background:transparent;border-radius:999px;padding:4px 11px;font:inherit;font-size:.82rem;cursor:pointer;transition:all .15s}
.chip:hover:not(:disabled){background:var(--brand);color:var(--brand-ink);transform:translateY(-1px)}
.chip:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px;white-space:normal}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:row;align-items:center;gap:9px;min-height:0;padding:8px 10px;border:0;border-radius:12px;text-align:left;color:#fff;font:inherit;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 18px -10px var(--a);transition:transform .15s,box-shadow .15s,opacity .2s,filter .2s;animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both}
.tile:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 22px -10px var(--a)}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:1.3rem;line-height:1;flex:none;width:1.5rem;text-align:center}
.tile .tx{display:flex;flex-direction:column;min-width:0}
.tile b{font-size:.88rem;font-weight:700;line-height:1.2}
.tile small{font-size:.68rem;line-height:1.2;opacity:.92}
.tiles.done .tile:not(.sel){opacity:.42;filter:saturate(.5)}
.tile.sel{outline:3px solid rgba(255,255,255,.75);outline-offset:-4px}
.k1{--a:#4f46e5;--b:#7c3aed}.k2{--a:#0f766e;--b:#15803d}.k3{--a:#ea580c;--b:#c2410c}.k4{--a:#db2777;--b:#e11d48}.k5{--a:#0369a1;--b:#2563eb}.k6{--a:#334155;--b:#475569}.k7{--a:#b45309;--b:#92400e}.k8{--a:#0e7490;--b:#155e75}.k9{--a:#4d7c0f;--b:#3f6212}
.sel2,.sel{font:inherit}
select.sel{display:block;width:100%;margin:9px 0;padding:11px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:.95rem}
select.sel:focus{border-color:var(--brand)}
.go{border:0;border-radius:12px;padding:9px 18px;font:inherit;font-weight:600;color:var(--brand-ink);background:linear-gradient(120deg,var(--brand),var(--brand2));cursor:pointer;transition:transform .15s}
.go:hover:not(:disabled){transform:translateY(-1px)}.go:disabled{opacity:.5}
form{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}
input[type=text]{flex:1;min-width:0;padding:12px 15px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit}
input[type=text]:focus{border-color:var(--brand);outline:0}
button{font:inherit}
.send{background:linear-gradient(120deg,var(--brand),var(--brand2));color:var(--brand-ink);border:0;border-radius:999px;padding:0 20px;font-weight:600;cursor:pointer;transition:transform .15s}
.send:hover{transform:translateY(-1px)}
#menub{padding:0 15px;border-radius:999px;font-size:1.05rem}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
details{margin:0 16px 10px;font-size:.88rem}
summary{cursor:pointer;color:var(--muted)}
textarea{width:100%;height:110px;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.82rem}
.row{display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><span class="logo">🎓</span><div><h1>ITI Buddy</h1><p id="sub">Ask about admission, seats, exams and session dates. हिंदी में भी पूछें।</p></div></div><button id="lang" type="button">हिंदी</button></header>
<div class="crumb" id="crumb" hidden></div>
<div class="note" id="note">Seat and application details come from the UP ITI admission booklet 2026-27. Entries marked [Sample] are placeholders. Replace them with official notices before sharing with trainees.</div>
<div id="log" aria-live="polite"></div>
<details hidden><summary>Knowledge base (<span id="cnt">0</span> passages)</summary>
<textarea id="kb" aria-label="Add passages" placeholder="One passage per line: Category | Title | Text | Source"></textarea>
<div class="row"><button class="chip" id="add" type="button">Add passages</button><button class="chip" id="reset" type="button">Reset to sample</button><span id="msg" style="color:var(--muted)"></span></div></details>
<form id="f"><button type="button" class="chip" id="menub" aria-label="Menu">☰</button><input type="text" id="q" placeholder="Or type your question…" autocomplete="off" aria-label="Your question"><button class="send" id="askb" type="submit">Ask</button></form>
</div>
<script>
var SAMPLE=[
{c:"Admission",t:"Admission process",ht:"प्रवेश प्रक्रिया",x:"Admission to government and private ITIs for session 2026-27 is through the state-level ITI admission process run by SCVT UP, Lucknow. Seats are filled on merit based on marks in the qualifying exam.",h:"सत्र 2026-27 में राजकीय एवं निजी आईटीआई में प्रवेश एससीवीटी यूपी, लखनऊ द्वारा संचालित राज्य स्तरीय आईटीआई प्रवेश प्रक्रिया से होता है। सीटें अर्हकारी परीक्षा के प्राप्तांकों की मेरिट के आधार पर भरी जाती हैं।",s:"UP ITI admission booklet 2026-27, p. 11"},
{c:"Admission",t:"How to apply online",ht:"ऑनलाइन आवेदन कैसे करें",x:"Open http://www.scvtup.in and click the link Online Submission of Application for Admission for Session 2026-27 for Government/Private ITI. Enter your name, father name, mother name, category and mobile number, tap Send OTP, then enter the OTP and tap Verify & Proceed. Enter your Aadhaar number, which is verified online. The fee is paid online by debit card, credit card, net banking or UPI.",h:"http://www.scvtup.in खोलें और Online Submission of Application for Admission for Session 2026-27 for Government/Private ITI लिंक पर क्लिक करें। अपना नाम, पिता का नाम, माता का नाम, श्रेणी और मोबाइल नंबर भरें, Send OTP दबाएँ, फिर OTP डालकर Verify & Proceed दबाएँ। अपना आधार नंबर दर्ज करें, जिसका सत्यापन ऑनलाइन होता है। शुल्क का भुगतान ऑनलाइन डेबिट कार्ड, क्रेडिट कार्ड, नेट बैंकिंग या यूपीआई से किया जाता है।",s:"UP ITI admission booklet 2026-27, p. 12"},
{c:"Admission",t:"Age and eligibility",ht:"आयु और पात्रता",x:"The minimum age is 14 years as on 01 August 2026. Each trade needs either Class 8 pass or Class 10 pass. Trade codes and qualification are listed in the booklet annexures 02 to 06 (Class 10 trades) and 07 to 10 (Class 8 trades). The seat tables show 8th Pass or 10th Pass against each trade.",h:"न्यूनतम आयु 01 अगस्त 2026 को 14 वर्ष होनी चाहिए। प्रत्येक ट्रेड के लिए कक्षा 8 या कक्षा 10 उत्तीर्ण होना आवश्यक है। ट्रेड कोड और योग्यता पुस्तिका के परिशिष्ट 02 से 06 (कक्षा 10 के ट्रेड) और 07 से 10 (कक्षा 8 के ट्रेड) में दी गई है। सीट तालिकाओं में हर ट्रेड के आगे 8th Pass या 10th Pass लिखा है।",s:"UP ITI admission booklet 2026-27, pp. 14, 45-61"},
{c:"Seats",t:"Total seats and ITIs in UP",ht:"उत्तर प्रदेश में कुल आईटीआई और सीटें",x:"Session 2026 has 1,53,643 seats in government ITIs. There are 321 government ITIs, of which 12 are exclusively for women, 47 have women branches, 43 are in minority-concentrated areas and 84 run under the Scheduled Caste Sub Plan. 86 trades are offered. PPP-model institutes: 42 institutes with 13,138 seats. Private ITIs: over 2,900 institutes with 2,95,668 seats.",h:"सत्र 2026 में राजकीय आईटीआई में कुल 1,53,643 सीटें हैं। प्रदेश में 321 राजकीय आईटीआई हैं, जिनमें 12 केवल महिलाओं के लिए हैं, 47 में महिला शाखाएँ हैं, 43 अल्पसंख्यक बहुल क्षेत्रों में हैं और 84 अनुसूचित जाति उप योजना के अंतर्गत संचालित हैं। कुल 86 ट्रेड उपलब्ध हैं। पीपीपी मॉडल के 42 संस्थानों में 13,138 सीटें हैं। निजी आईटीआई 2,900 से अधिक हैं, जिनमें 2,95,668 सीटें हैं।",s:"UP ITI admission booklet 2026-27, p. 11"},
{c:"Seats",t:"What the seat numbers mean",ht:"सीट संख्या का अर्थ",x:"Seat figures in this bot are approved seats per trade and institute for session August 2026, taken from annexures 13 to 16. They are not live vacancy. Remaining seats after each counselling round are published on the admission portal.",h:"इस बॉट में दी गई सीटें अगस्त 2026 सत्र के लिए प्रत्येक ट्रेड और संस्थान की स्वीकृत सीटें हैं, जो परिशिष्ट 13 से 16 से ली गई हैं। ये वर्तमान रिक्त सीटें नहीं हैं। हर काउंसलिंग राउंड के बाद शेष सीटें प्रवेश पोर्टल पर प्रकाशित होती हैं।",s:"UP ITI admission booklet 2026-27, annexures 13-16"},
{c:"Session",t:"Session start",ht:"सत्र प्रारंभ",x:"Admission is for the training session starting August 2026 (session 2026-27).",h:"प्रवेश अगस्त 2026 से शुरू होने वाले प्रशिक्षण सत्र (सत्र 2026-27) के लिए है।",s:"UP ITI admission booklet 2026-27, annexures 13-16"},
{c:"Admission",t:"Important admission dates",ht:"प्रवेश की महत्वपूर्ण तिथियाँ",x:"[Sample] Last date to apply: DD Month YYYY. Merit list: DD Month YYYY. Counselling round 1: DD Month YYYY. Replace with dates from the current admission notice, as this booklet text does not list them.",h:"[नमूना] आवेदन की अंतिम तिथि: DD माह YYYY। मेरिट सूची: DD माह YYYY। काउंसलिंग राउंड 1: DD माह YYYY। इन्हें वर्तमान प्रवेश सूचना की तिथियों से बदलें, क्योंकि इस पुस्तिका के पाठ में ये तिथियाँ नहीं हैं।",s:"[Sample] Admission schedule"},
{c:"Exam",t:"All India Trade Test",ht:"अखिल भारतीय व्यापार परीक्षा",x:"[Sample] The All India Trade Test (AITT) is conducted by NCVT and DGT. Two-year trades have four semester exams, one-year trades have two. Replace with the current NCVT exam scheme.",h:"[नमूना] अखिल भारतीय व्यापार परीक्षा (AITT) एनसीवीटी और डीजीटी द्वारा आयोजित की जाती है। दो वर्षीय ट्रेडों में चार सेमेस्टर परीक्षाएँ और एक वर्षीय ट्रेडों में दो परीक्षाएँ होती हैं। इसे वर्तमान एनसीवीटी परीक्षा योजना से बदलें।",s:"[Sample] NCVT exam scheme"},
{c:"Exam",t:"Exam dates and admit card",ht:"परीक्षा तिथि और प्रवेश पत्र",x:"[Sample] Semester exam window: Month YYYY. Admit cards are released through your ITI about one to two weeks before the exam. Replace with the current exam notice.",h:"[नमूना] सेमेस्टर परीक्षा की अवधि: माह YYYY। प्रवेश पत्र परीक्षा से लगभग एक से दो सप्ताह पहले आपके आईटीआई के माध्यम से जारी होते हैं। इसे वर्तमान परीक्षा सूचना से बदलें।",s:"[Sample] Exam notice"},
{c:"Support",t:"Contact and grievance",ht:"संपर्क और शिकायत",x:"[Sample] Contact your ITI principal first, then the district nodal principal or your division Joint Director. Helpline: 0000-000-0000.",h:"[नमूना] पहले अपने आईटीआई के प्रधानाचार्य से संपर्क करें, फिर जनपद के नोडल प्रधानाचार्य या अपने मंडल के संयुक्त निदेशक से। हेल्पलाइन: 0000-000-0000।",s:"[Sample] Helpdesk"},
{c:"Scholarship",t:"Scholarship for ITI trainees",ht:"छात्रवृत्ति: आईटीआई प्रशिक्षणार्थियों के लिए",x:"ITI trainees in Uttar Pradesh can apply for the UP Scholarship and Fee Reimbursement scheme run by the Social Welfare Department. ITI courses come under Post-Matric Other Than Intermediate, also called Dashmottar. Applications are online at scholarship.up.gov.in. Eligible categories are General, OBC, SC, ST and Minority. There is no application fee. The money is paid by direct bank transfer.",h:"उत्तर प्रदेश के आईटीआई प्रशिक्षणार्थी समाज कल्याण विभाग द्वारा संचालित यूपी छात्रवृत्ति एवं शुल्क प्रतिपूर्ति योजना के लिए आवेदन कर सकते हैं। आईटीआई पाठ्यक्रम दशमोत्तर (पोस्ट मैट्रिक अदर दैन इंटरमीडिएट) श्रेणी में आते हैं। आवेदन ऑनलाइन scholarship.up.gov.in पर होता है। पात्र श्रेणियाँ हैं: सामान्य, ओबीसी, एससी, एसटी और अल्पसंख्यक। आवेदन शुल्क नहीं है। राशि सीधे बैंक खाते में (डीबीटी) भेजी जाती है।",s:"UP Scholarship portal and news reports (verify on scholarship.up.gov.in)"},
{c:"Scholarship",t:"Scholarship eligibility",ht:"छात्रवृत्ति: कौन आवेदन कर सकता है",x:"You generally need to be a UP domicile, studying in a recognised ITI course, and within the family income limit. Reported limits for post-matric: General, OBC and Minority up to Rs 2 lakh a year; SC and ST up to Rs 2.5 lakh a year. Your Aadhaar details must match your records. Check the final rules on the portal.",h:"सामान्यतः आप उत्तर प्रदेश के मूल निवासी हों, मान्यता प्राप्त आईटीआई पाठ्यक्रम में पढ़ रहे हों और पारिवारिक आय सीमा के भीतर हों। बताई गई सीमा: सामान्य, ओबीसी और अल्पसंख्यक के लिए प्रति वर्ष 2 लाख रुपये तक; एससी और एसटी के लिए 2.5 लाख रुपये तक। आपका आधार विवरण आपके अभिलेखों से मेल खाना चाहिए। अंतिम नियम पोर्टल पर देखें।",s:"UP Scholarship portal and news reports (verify on scholarship.up.gov.in)"},
{c:"Scholarship",t:"How to apply for scholarship",ht:"छात्रवृत्ति के लिए आवेदन कैसे करें",x:"1. Go to scholarship.up.gov.in and complete One Time Registration (OTR).\n2. Log in and choose Post-Matric Other Than Intermediate (Dashmottar), fresh or renewal.\n3. Enter your course, ITI, admission or counselling number, fee details, income and category.\n4. Upload documents and submit the form.\n5. Take the final printout and give the hard copy with attachments to your ITI.\n6. Your ITI verifies the form, then the district committee and NIC scrutinise it.",h:"1. scholarship.up.gov.in पर जाएँ और वन टाइम रजिस्ट्रेशन (OTR) पूरा करें।\n2. लॉगिन करके दशमोत्तर (Post-Matric Other Than Intermediate) चुनें, नया (Fresh) या नवीनीकरण (Renewal)।\n3. अपना पाठ्यक्रम, आईटीआई, प्रवेश या काउंसलिंग नंबर, शुल्क विवरण, आय और श्रेणी भरें।\n4. दस्तावेज़ अपलोड करके फॉर्म जमा करें।\n5. अंतिम प्रिंटआउट निकालें और संलग्नकों सहित हार्ड कॉपी अपने आईटीआई में जमा करें।\n6. आपका आईटीआई फॉर्म सत्यापित करता है, फिर जिला समिति और एनआईसी जाँच करते हैं।",s:"UP Scholarship portal and news reports (verify on scholarship.up.gov.in)"},
{c:"Scholarship",t:"Scholarship dates",ht:"छात्रवृत्ति की तिथियाँ",x:"Reported dates for session 2026-27 (Dashmottar): fresh applications 15 September to 31 October 2026. Renewal applications 15 September to 15 October 2026. Fresh applicants: final printout by 2 November and hard copy to the ITI by 4 November 2026. Funds for renewal cases are planned for 1 to 10 December 2026. Dates can change, so check scholarship.up.gov.in for any extension or correction window.",h:"सत्र 2026-27 (दशमोत्तर) की बताई गई तिथियाँ: नए आवेदन 15 सितंबर से 31 अक्टूबर 2026। नवीनीकरण आवेदन 15 सितंबर से 15 अक्टूबर 2026। नए आवेदकों के लिए अंतिम प्रिंटआउट 2 नवंबर तक और आईटीआई में हार्ड कॉपी 4 नवंबर 2026 तक। नवीनीकरण मामलों की धनराशि 1 से 10 दिसंबर 2026 के बीच भेजने की योजना है। तिथियाँ बदल सकती हैं, इसलिए विस्तार या सुधार की अवधि के लिए scholarship.up.gov.in देखें।",s:"UP Scholarship portal and news reports (verify on scholarship.up.gov.in)"},
{c:"Scholarship",t:"Scholarship documents",ht:"छात्रवृत्ति के दस्तावेज़",x:"Typical documents: Aadhaar, domicile certificate, income certificate, caste certificate if applicable, previous marksheet, admission and fee receipt from your ITI, bank passbook and a passport photo. The exact list is shown on the portal and by your ITI, so follow that list.",h:"सामान्य दस्तावेज़: आधार, मूल निवास प्रमाण पत्र, आय प्रमाण पत्र, जाति प्रमाण पत्र (यदि लागू हो), पिछली अंकतालिका, आपके आईटीआई की प्रवेश एवं शुल्क रसीद, बैंक पासबुक और पासपोर्ट फोटो। सटीक सूची पोर्टल और आपके आईटीआई द्वारा बताई जाती है, उसी का पालन करें।",s:"UP Scholarship portal and news reports (verify on scholarship.up.gov.in)"},
{c:"Scholarship",t:"Scholarship status and payment",ht:"छात्रवृत्ति की स्थिति और भुगतान",x:"Check your application status by logging in at scholarship.up.gov.in. After verification by the ITI, the district committee and NIC, the money is sent by direct bank transfer (DBT). If your form is returned or rejected, correct it as shown on the portal, or ask your ITI principal or the district social welfare office.",h:"scholarship.up.gov.in पर लॉगिन करके अपने आवेदन की स्थिति देखें। आईटीआई, जिला समिति और एनआईसी के सत्यापन के बाद धनराशि सीधे बैंक खाते (डीबीटी) में भेजी जाती है। यदि आपका फॉर्म वापस या अस्वीकृत हो जाए, तो पोर्टल के निर्देश के अनुसार सुधारें, या अपने आईटीआई के प्रधानाचार्य या जिला समाज कल्याण कार्यालय से पूछें।",s:"UP Scholarship portal and news reports (verify on scholarship.up.gov.in)"},
{c:"Admission",t:"Fees and charges",ht:"शुल्क और प्रभार",x:"Fees and charges (as per the admission booklet):\n• Online application fee: General and OBC Rs 300, SC and ST Rs 250, women of all categories Rs 100.\n• At admission in the ITI: caution money Rs 300, and training fee Rs 40 per month for all trainees except SC and ST.\n• Private ITIs: the booklet quotes a standard fee of Rs 18,000 a year for engineering trades and Rs 15,400 a year for non-engineering trades, from a 2018 order covering 2018-19 to 2020-21. Check the current fee with the ITI.\n• Seat Acceptance Fee Rs 1,000: in private ITI upgrade rounds, if you choose Float you pay this online to SCVT UP. It is moved to your new ITI if you are upgraded.\n• PPP ITIs: seats carry either the government fee or the private fee, as shown in annexure 15.",h:"शुल्क और प्रभार (प्रवेश पुस्तिका के अनुसार):\n• ऑनलाइन आवेदन शुल्क: सामान्य और ओबीसी 300 रुपये, एससी और एसटी 250 रुपये, सभी वर्गों की महिलाएँ 100 रुपये।\n• आईटीआई में प्रवेश के समय: कॉशन मनी 300 रुपये, और प्रशिक्षण शुल्क 40 रुपये प्रति माह, एससी और एसटी को छोड़कर सभी प्रशिक्षणार्थियों से।\n• निजी आईटीआई: पुस्तिका में 2018 के शासनादेश (सत्र 2018-19 से 2020-21) के अनुसार मानक शुल्क इंजीनियरिंग ट्रेड में 18,000 रुपये और नॉन-इंजीनियरिंग ट्रेड में 15,400 रुपये प्रति वर्ष बताया गया है। वर्तमान शुल्क अपने आईटीआई से पूछें।\n• सीट एक्सेप्टेंस फीस 1,000 रुपये: निजी आईटीआई की उच्चीकरण प्रक्रिया में यदि आप Float चुनते हैं तो यह राशि एससीवीटी यूपी को ऑनलाइन जमा करनी होती है। उच्चीकरण होने पर यह आपके नए आईटीआई को स्थानांतरित कर दी जाती है।\n• पीपीपी आईटीआई: सीटें सरकारी शुल्क या निजी शुल्क वाली होती हैं, जो परिशिष्ट 15 में दिखाई गई हैं।",s:"UP ITI admission booklet 2026-27 (fee instructions)"},
{c:"Placement",t:"Placement and apprenticeship melas",ht:"प्लेसमेंट और अप्रेंटिसशिप मेले",x:"Two kinds of melas are held at or around government ITIs. District rozgar (placement) melas are run under UP Rozgar Mission by the District Employment Office, the ITI and UP Skill Development Mission, with 15 to 40 companies interviewing on the spot. The Pradhan Mantri National Apprenticeship Mela (PMNAM) is run by the Ministry of Skill Development and brings employers who offer apprenticeships to ITI pass-outs. District melas are free to attend.",h:"सरकारी आईटीआई में या उसके आसपास दो प्रकार के मेले लगते हैं। जिला रोजगार (प्लेसमेंट) मेले उत्तर प्रदेश रोजगार मिशन के तहत जिला सेवायोजन कार्यालय, आईटीआई और उत्तर प्रदेश कौशल विकास मिशन द्वारा लगाए जाते हैं, जिनमें 15 से 40 कंपनियाँ मौके पर साक्षात्कार लेती हैं। प्रधानमंत्री राष्ट्रीय अप्रेंटिसशिप मेला (PMNAM) कौशल विकास मंत्रालय द्वारा आयोजित होता है, जिसमें अप्रेंटिसशिप देने वाले नियोक्ता आईटीआई उत्तीर्ण युवाओं से मिलते हैं। जिला मेलों में भाग लेना निःशुल्क है।",s:"News reports (Amar Ujala and others, 1-3 Nov 2026); confirm with your District Employment Office"},
{c:"Placement",t:"Placement mela dates",ht:"मेले की तिथियाँ",x:"Reported melas in November 2026:\n• 3 Nov: district mela at the ITI campus, Fatehpur, from 10 am (40+ companies).\n• 3 Nov: Government ITI Salarpur, Badaun, and 4 Nov: BIMT campus, Badaun (15+ companies).\n• 4 Nov: Government ITI, Shahjahanpur, from 10 am (25 to 30 companies).\n• 12 Nov: one-day mela at IIMT University, Ganganagar, Meerut (about 150 companies expected).\nPMNAM is held on different dates in different districts, so check the Apprenticeship India portal or your ITI notice. Some of these dates may already be over. Ask your ITI principal or District Employment Office for the next mela in your district.",h:"नवंबर 2026 में बताए गए मेले:\n• 3 नवंबर: आईटीआई परिसर फतेहपुर में जिला स्तरीय मेला, सुबह 10 बजे से (40 से अधिक कंपनियाँ)।\n• 3 नवंबर: राजकीय आईटीआई सालारपुर, बदायूं, और 4 नवंबर: बीआईएमटी परिसर, बदायूं (15 से अधिक कंपनियाँ)।\n• 4 नवंबर: राजकीय आईटीआई शाहजहांपुर, सुबह 10 बजे से (25 से 30 कंपनियाँ)।\n• 12 नवंबर: आईआईएमटी विश्वविद्यालय, गंगानगर, मेरठ में एक दिवसीय मेला (लगभग 150 कंपनियाँ अपेक्षित)।\nPMNAM अलग-अलग जिलों में अलग-अलग तिथियों पर होता है, इसलिए अप्रेंटिसशिप इंडिया पोर्टल या अपने आईटीआई की सूचना देखें। इनमें से कुछ तिथियाँ बीत चुकी हो सकती हैं। अपने जिले के अगले मेले के लिए आईटीआई के प्रधानाचार्य या जिला सेवायोजन कार्यालय से पूछें।",s:"News reports (Amar Ujala and others, 1-3 Nov 2026); confirm with your District Employment Office"},
{c:"Placement",t:"Who can attend melas",ht:"मेले में कौन भाग ले सकता है",x:"District melas: candidates who passed High School, Intermediate, ITI, diploma, graduation or post-graduation, aged 18 to 40 (as reported for Badaun). PMNAM: Class 5 to 12 pass, skill training certificate holders, ITI and diploma holders, and graduates. Rozgar mela candidates must be registered on the state employment portal.",h:"जिला मेले: हाईस्कूल, इंटरमीडिएट, आईटीआई, डिप्लोमा, स्नातक या परास्नातक उत्तीर्ण, 18 से 40 वर्ष के अभ्यर्थी (बदायूं के लिए बताए अनुसार)। PMNAM: कक्षा 5 से 12 उत्तीर्ण, कौशल प्रशिक्षण प्रमाणपत्र धारक, आईटीआई और डिप्लोमा धारक तथा स्नातक। रोजगार मेले के अभ्यर्थियों का राज्य के रोजगार पोर्टल पर पंजीकरण होना आवश्यक है।",s:"News reports (Amar Ujala and others, 1-3 Nov 2026); confirm with your District Employment Office"},
{c:"Placement",t:"How to register for melas",ht:"मेले के लिए पंजीकरण कैसे करें",x:"1. Register on the UP employment portal (Rozgar Sangam / Sewayojan) before the mela. For apprenticeships, create your profile on the Apprenticeship India portal.\n2. Reach the venue by 10 am.\n3. Typical items to carry: educational and ITI certificates or marksheets, Aadhaar, and photocopies of your biodata with passport photos.\n4. Companies interview and select on the spot. Ask your District Employment Office for details.",h:"1. मेले से पहले उत्तर प्रदेश के रोजगार पोर्टल (रोजगार संगम / सेवायोजन) पर पंजीकरण करें। अप्रेंटिसशिप के लिए अप्रेंटिसशिप इंडिया पोर्टल पर अपनी प्रोफ़ाइल बनाएँ।\n2. सुबह 10 बजे तक स्थल पर पहुँचें।\n3. सामान्यतः साथ ले जाएँ: शैक्षिक और आईटीआई प्रमाणपत्र या अंकतालिका, आधार, और बायोडाटा की फोटोकॉपी व पासपोर्ट फोटो।\n4. कंपनियाँ मौके पर साक्षात्कार लेकर चयन करती हैं। विवरण के लिए जिला सेवायोजन कार्यालय से पूछें।",s:"News reports (Amar Ujala and others, 1-3 Nov 2026); confirm with your District Employment Office"}

var SYN={"प्रवेश":"admission apply","आवेदन":"apply admission","सीट":"seat seats vacancy","सीटें":"seats vacancy","रिक्त":"vacant seats","परीक्षा":"exam test","तारीख":"date dates","तिथि":"date dates","सत्र":"session","शुरू":"start","अंतिम":"last end","समाप्त":"end","पात्रता":"eligibility who can apply","योग्यता":"eligibility","दस्तावेज":"documents","कागज":"documents","प्रवेश-पत्र":"admit card","एडमिट":"admit","उपस्थिति":"attendance","छुट्टी":"holidays","शिकायत":"grievance contact","संपर्क":"contact","आईटीआई":"iti","काउंसलिंग":"counselling","परिणाम":"result"};
var STOP={"the":1,"a":1,"an":1,"is":1,"are":1,"to":1,"of":1,"for":1,"in":1,"on":1,"and":1,"or":1,"what":1,"how":1,"do":1,"i":1,"my":1,"me":1,"can":1,"when":1,"कब":1,"क्या":1,"है":1,"हैं":1,"का":1,"की":1,"के":1,"में":1,"से":1,"को":1,"कैसे":1,"और":1};
["mein","me","main","ka","ki","ke","ko","hai","hain","kitni","kitne","batao","bataiye","dikhao","chahiye","koi","aur","kya","kaise","kab","liye","mujhe","please","pls"].forEach(function(w){STOP[w]=1});
SYN["छात्रवृत्ति"]="scholarship";SYN["शुल्क"]="fees fee";SYN["फीस"]="fees fee";SYN["मेला"]="mela placement";SYN["मेले"]="mela placement";SYN["रोजगार"]="rozgar job placement";SYN["नौकरी"]="job placement";SYN["प्रशिक्षुता"]="apprenticeship";SYN["अप्रेंटिसशिप"]="apprenticeship";SYN["प्लेसमेंट"]="placement";SYN["स्कॉलरशिप"]="scholarship";SYN["वजीफा"]="scholarship";
var KB=[],idx=null,idxH=null;
function tok(s){var m=String(s).toLowerCase().match(/[\p{L}\p{M}\p{N}-]+/gu)||[],o=[];m.forEach(function(w){if(STOP[w])return;o.push(w);if(SYN[w])SYN[w].split(" ").forEach(function(e){o.push(e)});if(w.length>3&&/s$/.test(w))o.push(w.slice(0,-1))});return o}
